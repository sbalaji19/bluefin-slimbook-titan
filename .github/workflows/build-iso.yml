---
name: Build ISO Installer
on:
  workflow_dispatch:  # Manual trigger only
  workflow_run:
    workflows: ["Build container image"]
    branches: [main]
    types: [completed]

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: write
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@517622d6452028f266b7ba4cc9a123b5f58a6b53 # v7
        with:
          remove-codeql: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch iso.toml with correct image URL and merge disk config
        run: |
          IMAGE_URL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:stable"
          sed -i "s|ghcr.io/USERNAME/REPO:stable|${IMAGE_URL}|g" iso/iso.toml
          # Merge disk.toml filesystem config into iso.toml
          cat iso/disk.toml >> iso/iso.toml
          echo "Using image: ${IMAGE_URL}"
          cat iso/iso.toml

      - name: Pull image before ISO build
        run: |
          sudo podman pull ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:stable

      - name: Build ISO with bootc-image-builder
        run: |
          mkdir -p output
          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./iso/iso.toml:/config.toml:ro \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ghcr.io/osbuild/bootc-image-builder:latest \
            --type anaconda-iso \
            --config /config.toml \
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:stable

      - name: Rename ISO
        id: rename
        run: |
          DATE=$(date +%Y%m%d)
          mv output/bootiso/install.iso output/bootiso/bluefin-slimbook-titan-${DATE}.iso
          sha256sum output/bootiso/bluefin-slimbook-titan-${DATE}.iso > output/bootiso/bluefin-slimbook-titan-${DATE}.iso.sha256
          echo "iso_name=bluefin-slimbook-titan-${DATE}.iso" >> ${GITHUB_OUTPUT}

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.iso_name }}
          path: |
            output/bootiso/*.iso
            output/bootiso/*.sha256
          retention-days: 7
