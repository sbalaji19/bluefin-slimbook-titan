# Anaconda ISO Installer Configuration
# This configuration creates a bootable ISO image for installing your custom bootc image.
#
# The installer will guide users through disk partitioning and basic system setup,
# then automatically switch to your custom image on first boot.
#
# NOTE — Installer GUI version:
# bootc-image-builder (BIB) is internally based on CentOS Stream and bundles its own
# Anaconda installer runtime. This means the ISO will show the older Qt-based Anaconda UI,
# not the new Fedora 43 WebUI, regardless of the target image's Fedora version.
# This is a BIB upstream limitation — the installer UI comes from BIB itself, not your image.
#
# Workaround: Use the live-iso build job instead. It boots directly into your full
# Fedora 43 GNOME desktop with all customizations visible, and users can install
# from the live session via GNOME's installer or `bootc install` commands.

[customizations.installer.kickstart]
contents = """
%post
# After installation, switch to the custom image from this repository
# IMPORTANT: Update this URL to match your repository (ghcr.io/USERNAME/REPO:stable)
bootc switch --mutate-in-place --transport registry ghcr.io/USERNAME/REPO:stable
%end
"""

[customizations.installer.modules]
# Minimal GNOME installer config — matches upstream ublue-os/image-template iso-gnome.toml.
# Only Storage (disk partitioning) and Runtime (basic setup) are needed.
# All other setup — user account, timezone, network, security — is handled by
# GNOME Initial Setup on first boot, which is the standard Bluefin/GNOME experience.
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",    # Disk partitioning and formatting
  "org.fedoraproject.Anaconda.Modules.Runtime",    # Basic runtime configuration
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Subscription",
  "org.fedoraproject.Anaconda.Modules.Timezone",
]
